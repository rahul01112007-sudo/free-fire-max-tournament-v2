name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q free-fire-max-tournament-platform.zip -d project
          find project -name package.json -print

      - name: Find project directory
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name package.json -print -quit)")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Build web app
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "build" ]; then
            WEB_DIR="build"
          else
            echo "Build folder not found"
            exit 1
          fi

          cat > capacitor.config.ts <<EOF
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.freemax.tournament',
            appName: 'Free Fire Max Tournament',
            webDir: '$WEB_DIR',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Add Android platform
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap add android

      - name: Sync Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Free-Fire-Max-Tournament-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
